<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC test client</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; background: #111; color: #ddd; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  #bar, #bar2 { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  #prompt { flex: 1; min-width: 260px; }
  select, input { padding: 6px 8px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; }
  button { padding: 6px 14px; background: #2a6; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #444; cursor: default; }
  #stop { background: #a33; }
  #stage { display: flex; gap: 12px; flex-wrap: wrap; }
  #stage .cell { flex: 1; min-width: 300px; }
  #stage .cell h2 { font-size: 13px; color: #8cf; margin: 0 0 6px; }
  /* split & blend: output video overlays the input box exactly */
  #stage.split, #stage.blend { display: block; position: relative; max-width: 720px; }
  #stage.split .cell, #stage.blend .cell { min-width: 0; }
  #stage.split .cell h2, #stage.blend .cell h2 { display: none; }
  #stage.split .cell.out, #stage.blend .cell.out { position: absolute; inset: 0; }
  #stage.split .cell.out video, #stage.blend .cell.out video { height: 100%; object-fit: cover; }
  #stage.split .cell.out video { clip-path: inset(0 0 0 var(--mix, 50%)); }
  #stage.split::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--mix, 50%);
                        width: 2px; background: #8cf; z-index: 3; pointer-events: none; }
  #stage.blend .cell.out video { opacity: var(--mixa, 0.5); }
  #mix { width: 140px; accent-color: #8cf; }
  video { width: 100%; background: #000; border: 1px solid #333; border-radius: 4px; display: block; }
  #stats { margin: 8px 0; color: #8cf; }
  #log { background: #000; border: 1px solid #333; border-radius: 4px; padding: 8px; height: 220px;
         overflow-y: auto; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .err { color: #f66; } .ok { color: #6f6; } .info { color: #aaa; }
</style>
</head>
<body>
<h1>WebRTC test client</h1>
<div id="bar">
  <select id="mode">
    <option value="whipwhep">whip + whep (2 PCs, standard)</option>
    <option value="sendrecv">sendrecv /offer (1 PC, realtime-client style)</option>
  </select>
  <select id="source">
    <option value="canvas">test canvas (no permissions)</option>
    <option value="camera">camera</option>
  </select>
  <button id="go">Connect</button>
  <button id="stop" disabled>Disconnect</button>
  <select id="view">
    <option value="side">side by side</option>
    <option value="split">split view</option>
    <option value="blend">alpha blend</option>
  </select>
  <input type="range" id="mix" min="0" max="100" value="50" style="display:none"
         title="split position / blend amount">
</div>
<div id="bar2">
  <input id="prompt" placeholder="prompt — applies live via POST /prompt">
  <button id="send">Send prompt</button>
</div>
<div id="stage" class="side">
  <div class="cell in"><h2>input (published)</h2><video id="in" autoplay muted playsinline></video></div>
  <div class="cell out"><h2>output (received)</h2><video id="out" autoplay muted playsinline></video></div>
</div>
<div id="stats">idle</div>
<div id="log"></div>
<script>
const $ = id => document.getElementById(id);
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

let pcs = [];              // live peer connections (1 for sendrecv, 2 for whip/whep)
let sessions = [];         // WHIP/WHEP resource URLs to DELETE on disconnect
let srcStream = null, srcCanvas = null, canvasTimer = null;
let frames = 0, statsTimer = null;

function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `${new Date().toISOString().slice(11, 23)}  ${msg}`;
  $("log").appendChild(line);
  $("log").scrollTop = $("log").scrollHeight;
}

// Capture at the pipeline's input resolution — the server center-crops every
// inbound frame to it, so publishing larger only burns uplink.
let inputRes = { width: 512, height: 512 };
async function fetchInputRes() {
  try {
    const j = await (await fetch("/healthz")).json();
    if (j.resolution && j.resolution.width && j.resolution.height) inputRes = j.resolution;
  } catch { /* healthz unreachable — keep fallback */ }
  log(`capture resolution: ${inputRes.width}x${inputRes.height} (server input res)`, "info");
}

// Once the real output dimensions are known, sanity-check the capture size:
// FluxRT's flow-upscaler streams 2x the pipeline input, so output = 2x healthz
// res means capture should stay at half the output (i.e. the healthz res).
// Any other mismatch adapts capture to the output (sd-webrtc: output == input).
function adaptToOutput(w, h) {
  if (!w || !h) return;
  const isDouble = Math.abs(w / 2 - inputRes.width) <= 16 && Math.abs(h / 2 - inputRes.height) <= 16;
  if (isDouble) {
    log(`output ${w}x${h} = 2x input ${inputRes.width}x${inputRes.height} (upscaler on) — capture stays at half output`, "info");
    return;
  }
  if (w === inputRes.width && h === inputRes.height) return;
  inputRes = { width: w, height: h };
  if (srcCanvas) { srcCanvas.width = w; srcCanvas.height = h; }
  const t = srcStream && srcStream.getVideoTracks()[0];
  if (t && t.applyConstraints)
    t.applyConstraints({ width: { ideal: w }, height: { ideal: h } }).catch(() => {});
  log(`input adapted to output ${w}x${h}`, "info");
}

function canvasSource() {
  const cv = document.createElement("canvas");
  srcCanvas = cv;
  cv.width = inputRes.width; cv.height = inputRes.height;
  const ctx = cv.getContext("2d");
  let t = 0;
  canvasTimer = setInterval(() => {
    t += 1 / 15;
    const g = ctx.createLinearGradient(0, 0, cv.width, cv.height);
    g.addColorStop(0, `hsl(${(t * 40) % 360},70%,45%)`);
    g.addColorStop(1, `hsl(${(t * 40 + 120) % 360},70%,25%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    const x = (Math.sin(t) * 0.4 + 0.5) * cv.width, y = (Math.cos(t * 1.3) * 0.4 + 0.5) * cv.height;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 40, 0, 7); ctx.fill();
    ctx.fillStyle = "#000"; ctx.font = "bold 28px monospace";
    ctx.fillText("TEST " + t.toFixed(1) + "s", 20, cv.height - 24);
  }, 1000 / 15);
  return cv.captureStream(15);
}

async function getSource() {
  return $("source").value === "camera"
    ? navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: inputRes.width }, height: { ideal: inputRes.height } },
      })
    : canvasSource();
}

async function nonTrickle(pc) {
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise(res => {
    if (pc.iceGatheringState === "complete") return res();
    pc.addEventListener("icegatheringstatechange",
      () => pc.iceGatheringState === "complete" && res());
    setTimeout(res, 2000);
  });
}

function candStats(sdp) {
  const kinds = { host: 0, srflx: 0, relay: 0 };
  for (const m of sdp.matchAll(/typ (host|srflx|relay)/g)) kinds[m[1]]++;
  return `host:${kinds.host} srflx:${kinds.srflx} relay:${kinds.relay}`;
}

async function whipWhepExchange(path, pc) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/sdp" },
    body: pc.localDescription.sdp,
  });
  log(`POST ${path} ${r.status}`, r.status === 201 ? "ok" : "err");
  if (r.status !== 201) { log(await r.text(), "err"); throw new Error("signaling failed"); }
  sessions.push(r.headers.get("Location"));
  log(`session: ${r.headers.get("Location")}`, "ok");
  const answer = await r.text();
  log(`answer candidates — ${candStats(answer)}`, "info");
  await pc.setRemoteDescription({ type: "answer", sdp: answer });
}

async function offerExchange(pc) {
  const r = await fetch("/offer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
  });
  log(`POST /offer ${r.status}`, r.ok ? "ok" : "err");
  if (!r.ok) { log(await r.text(), "err"); throw new Error("signaling failed"); }
  const ans = await r.json();
  log(`answer candidates — ${candStats(ans.sdp)}`, "info");
  await pc.setRemoteDescription(ans);
}

function watchStates(pc, label) {
  pc.onconnectionstatechange = () => log(`${label}: ${pc.connectionState}`,
    pc.connectionState === "connected" ? "ok" : pc.connectionState === "failed" ? "err" : "info");
}

function countFrame() {
  frames++;
  if ($("out").requestVideoFrameCallback) $("out").requestVideoFrameCallback(countFrame);
}

function startStats() {
  frames = 0;
  if ($("out").requestVideoFrameCallback) $("out").requestVideoFrameCallback(countFrame);
  statsTimer = setInterval(async () => {
    let pair = "";
    for (const pc of pcs) {
      for (const s of (await pc.getStats()).values()) {
        if (s.type === "candidate-pair" && s.state === "succeeded" && s.nominated)
          pair = ` · ${(s.currentRoundTripTime * 1000) | 0}ms rtt`;
      }
    }
    const states = pcs.map(pc => pc.connectionState).join("/");
    $("stats").textContent =
      `${states || "idle"} · ${$("out").videoWidth}x${$("out").videoHeight} · ${frames} frames${pair}`;
  }, 1000);
}

async function connect() {
  $("go").disabled = true; $("stop").disabled = false;
  const mode = $("mode").value;
  try {
    await fetchInputRes();
    srcStream = await getSource();
    $("in").srcObject = srcStream;
    const track = srcStream.getVideoTracks()[0];

    if (mode === "sendrecv") {
      // realtime-client style: one PC, one sendrecv m-line, JSON /offer signaling
      const pc = new RTCPeerConnection(ICE);
      pcs = [pc];
      watchStates(pc, "sendrecv");
      pc.ontrack = e => { if (e.streams[0]) $("out").srcObject = e.streams[0]; };
      pc.addTransceiver(track, { direction: "sendrecv", streams: [srcStream] });
      await nonTrickle(pc);
      await offerExchange(pc);
    } else {
      // standards pair: sendonly PC -> /whip, recvonly PC -> /whep
      const pub = new RTCPeerConnection(ICE);
      const view = new RTCPeerConnection(ICE);
      pcs = [pub, view];
      watchStates(pub, "whip");
      watchStates(view, "whep");
      pub.addTrack(track, srcStream);
      view.addTransceiver("video", { direction: "recvonly" });
      view.ontrack = e => { if (e.streams[0]) $("out").srcObject = e.streams[0]; };
      await nonTrickle(pub);
      await whipWhepExchange("/whip", pub);
      await nonTrickle(view);
      await whipWhepExchange("/whep", view);
    }
    startStats();
  } catch (e) {
    log(`ERROR: ${e.message}`, "err");
    disconnect();
  }
}

async function disconnect() {
  clearInterval(statsTimer);
  for (const s of sessions.splice(0)) {
    try {
      const r = await fetch(s, { method: "DELETE" });
      log(`DELETE ${s} ${r.status}`, r.status === 200 ? "ok" : "err");
    } catch (e) { log(`DELETE failed: ${e.message}`, "err"); }
  }
  for (const pc of pcs.splice(0)) { try { pc.close(); } catch {} }
  if (srcStream) { srcStream.getTracks().forEach(t => t.stop()); srcStream = null; }
  clearInterval(canvasTimer);
  srcCanvas = null;
  $("in").srcObject = null;
  $("out").srcObject = null;
  $("stats").textContent = "idle";
  $("go").disabled = false; $("stop").disabled = true;
}

function applyMix() {
  const p = $("mix").value;
  $("stage").style.setProperty("--mix", p + "%");
  $("stage").style.setProperty("--mixa", p / 100);
}
function setView() {
  const v = $("view").value;
  $("stage").className = v;
  $("mix").style.display = v === "side" ? "none" : "";
  applyMix();
}

async function sendPrompt() {
  const p = $("prompt").value.trim();
  if (!p) return;
  try {
    const r = await fetch("/prompt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: p }),
    });
    log(`POST /prompt ${r.status}${r.ok ? "" : " " + (await r.text()).slice(0, 120)}`, r.ok ? "ok" : "err");
  } catch (e) { log(`prompt failed: ${e.message}`, "err"); }
}

$("go").onclick = connect;
$("stop").onclick = disconnect;
$("view").onchange = setView;
$("mix").oninput = applyMix;
$("send").onclick = sendPrompt;
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter") sendPrompt(); });
$("out").addEventListener("loadedmetadata", () => adaptToOutput($("out").videoWidth, $("out").videoHeight));
$("out").addEventListener("resize", () => adaptToOutput($("out").videoWidth, $("out").videoHeight));
setView();
</script>
</body>
</html>
